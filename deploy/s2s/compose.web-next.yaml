# Nouvelle interface (web/) servie à côté de l'actuelle, sur 127.0.0.1:8766, pendant
# la migration. Lancement sans toucher aux autres services :
#   docker compose -f compose.yaml -f compose.web-next.yaml up -d --no-deps --build web-next
---
services:
  web-next:
    extends:
      file: compose.yaml
      service: web
    image: antares/web-next:dev
    build:
      context: ../../web
    container_name: antares-web-next
    ports: !override
      - "127.0.0.1:8766:8765"
    volumes: !override
      - ./voices:/srv/voices:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
