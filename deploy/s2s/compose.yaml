# antares_ai — moteur speech-to-speech 100 % local.
#
# Garantie « full local » par construction :
#   - `s2s` n'est branché QUE sur `antares-local`, réseau Docker `internal` : aucune
#     route vers Internet, quelle que soit la configuration applicative ;
#   - il tourne en mode hors ligne HF (modèles préchargés par install.sh) ;
#   - les deux seuls ponts sont à cible fixe :
#       web        : 127.0.0.1:8765 (hôte) -> interface + /v1/* (s2s) + /api/* (router)
#       llm-router : s2s -> ollama:11434 (stack ai-to-boost), modèle choisi dans l'interface
#                    ou -> claude-bridge de l'hôte si un modèle Claude est choisi
#                    (seul cas où du texte quitte la machine, vers Anthropic) ;
#                    documentation des projets lue dans le RAG d'ai-to-boost (rag, qdrant)
#   LiteLLM est contourné : il perd `reasoning_effort` en streaming (latence x3).
#
# Premier lancement : ./install.sh  —  ensuite : docker compose up -d
# Interface d'appel : http://127.0.0.1:8765
---
name: antares-s2s

# Profil par défaut. Le modèle et la voix se changent ensuite dans l'interface
# (Réglages) ; les voix disponibles sont décrites dans voices/voices.json.
x-profile:
  llm: &llm gemma4:e4b
  stt: &stt parakeet-tdt
  tts: &tts qwen3
  tts-model: &tts-model Qwen/Qwen3-TTS-12Hz-1.7B-Base
  tts-quantization: &tts-quantization Q8_0
  default-voice: &default-voice /voices/sohee.wav
  # RAG des projets (service `rag` d'ai-to-boost) : extraits ajoutés par question
  rag-limit: &rag-limit "4"
  # Tirage Qwen3-TTS bridé (amont : 0.9 / 50) : ton régulier d'une phrase à l'autre
  tts-temperature: &tts-temperature "0.3"
  tts-top-k: &tts-top-k "10"
  # Sans pénalité, le tirage bridé s'emballe (pas de fin de phrase) ~6 % du temps
  tts-repetition-penalty: &tts-repetition-penalty "1.2"
  # Plafond de longueur : ~2 fois le débit mesuré, coupe un emballement résiduel
  tts-max-frames-per-char: &tts-max-frames-per-char "1.5"

x-s2s: &s2s
  image: antares/s2s:1.0.0
  build: .
  volumes:
    - s2s-cache:/root/.cache
    - ./voices:/voices:ro
  environment: &s2s-env
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
    # Lus par qwen3_sampling.py (cf. Dockerfile)
    QWEN3_TTS_TEMPERATURE: *tts-temperature
    QWEN3_TTS_TOP_K: *tts-top-k
    QWEN3_TTS_REPETITION_PENALTY: *tts-repetition-penalty
    QWEN3_TTS_MAX_FRAMES_PER_CHAR: *tts-max-frames-per-char
  command:
    - serve
    - --host=0.0.0.0
    - --port=8765
    - --stt
    - *stt
    - --parakeet_tdt_language=fr
    - --llm_backend=chat-completions
    # Valeur de démarrage : le routeur la remplace par le modèle choisi dans l'interface
    - --model_name
    - *llm
    - --responses_api_base_url=http://llm-router:11434/v1
    - --responses_api_api_key=
    # Les modèles gemma4 raisonnent par défaut (~350 tokens, +3 à 5 s) : désactivé pour la voix
    - --responses_api_reasoning_effort=none
    - --tts
    - *tts
    # Voix clonées (x-vector) : timbre stable d'une phrase à l'autre, contrairement
    # aux locuteurs prédéfinis du modèle CustomVoice (mesuré : cf. README)
    - --qwen3_tts_model_name
    - *tts-model
    - --qwen3_tts_ref_audio
    - *default-voice
    - --qwen3_tts_xvec_only=True
    - --qwen3_tts_language=french
    # Q8_0 : la version BF16 ne tient pas à côté du LLM dans 12 Go de VRAM
    - --qwen3_tts_ggml_quantization
    - *tts-quantization
    # Synthèse dès la 1re phrase (défaut amont : 3 phrases regroupées, +2 à 3 s sur
    # les réponses longues, et phrase d'attente de Claude retenue jusqu'à la réponse)
    - --stream_batch_sentences=1
    - --init_chat_role=system
    # Consigne par défaut ; l'interface l'adapte au prénom de la voix choisie
    - >-
      --init_chat_prompt=Tu es une assistante vocale bienveillante.
      Réponds toujours en français, de façon naturelle et sans markdown ni listes.
      En conversation, reste bref. Si l'on te demande un contenu long (poème, histoire,
      explication détaillée), donne-le en entier, sans t'arrêter pour demander s'il faut continuer.
    - --enable_live_transcription
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  s2s:
    <<: *s2s
    container_name: antares-s2s
    restart: unless-stopped
    networks: [antares-local]
    depends_on: [llm-router]

  # Préchargement des modèles (install.sh uniquement) : seul conteneur avec accès Internet.
  warmup:
    <<: *s2s
    profiles: [warmup]
    environment:
      <<: *s2s-env
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    networks: [antares-local, antares-download]
    depends_on: [llm-router]

  web:
    image: nginx:1.29-alpine
    container_name: antares-web
    restart: unless-stopped
    depends_on: [s2s, llm-router]
    environment:
      ANTARES_STT: *stt
      ANTARES_TTS: *tts
      ANTARES_TTS_QUANTIZATION: *tts-quantization
    volumes:
      - ../../frontend:/usr/share/nginx/html:ro
      - ./voices:/srv/voices:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8765:8765"
    networks: [antares-local, antares-edge]

  # Code maison à cible fixe (Ollama) : même image que s2s, sans GPU.
  llm-router:
    image: antares/s2s:1.0.0
    container_name: antares-llm-router
    restart: unless-stopped
    entrypoint: [python, /app/router.py]
    environment:
      OLLAMA_URL: http://ollama:11434
      DEFAULT_MODEL: *llm
      # Claude Code via le claude-bridge d'ai-to-boost (service de l'hôte, port 8088).
      # Token recopié par install.sh ; vide = modèles Claude masqués.
      CLAUDE_BRIDGE_URL: http://host.docker.internal:8088
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      CLAUDE_MODELS: opus,sonnet
      # RAG d'ai-to-boost (réseau ai-assistant-net) : projets = collections proj-* de Qdrant
      RAG_URL: http://rag:8100
      QDRANT_URL: http://qdrant:6333
      RAG_LIMIT: *rag-limit
      # Fiches de connaissance : écriture dans le RAG (jeton recopié par install.sh)
      RAG_WRITE_TOKEN: ${RAG_WRITE_TOKEN:-}
      # Agents d'action : worker Claude Code d'ai-to-boost (service de l'hôte, port 8089)
      AGENT_URL: http://host.docker.internal:8089
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./router:/app:ro
      - ./voices:/voices:ro
      - router-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/healthz', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 20s
    networks: [antares-local, ai-assistant-net]

networks:
  antares-local:
    name: antares-local
    internal: true
  antares-edge:
    name: antares-edge
  antares-download:
    name: antares-download
  ai-assistant-net:
    external: true

volumes:
  s2s-cache:
    name: antares-s2s-cache
  router-data:
    name: antares-router-data
