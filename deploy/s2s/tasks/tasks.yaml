---
# Tâches planifiées d'antares (service antares-tasks) : veille informatique et météo.
# Relu au démarrage du service (docker compose restart antares-tasks après modification ;
# le routeur relit `categories` et `idea_prompt` à chaque requête).
# Aucun secret ici : le modèle passe par les Connexions du routeur (connections.json).

# Fuseau des horaires ci-dessous (heure d'été et d'hiver gérées)
timezone: Europe/Paris
# Créneaux de la veille, heure locale HH:MM
slots: ["08:00", "13:00", "18:00"]
# Retard toléré sur un créneau (mise en veille du poste, appel en cours) ; au-delà, le
# créneau est noté « manqué » et n'est jamais rattrapé
late_tolerance_min: 15
# Conservation des passages, de la météo, des créneaux et des idées (les adresses déjà
# vues, les votes et les prompts d'idées sont gardés sans limite)
retention_days: 30

# Météo (Open-Meteo, sans clé) : relevée à chaque passage (`every_run`), sinon au premier
# créneau du jour ; `hours` heures pleines dans la frise
weather:
  label: Le Pellerin
  latitude: 47.20
  longitude: -1.75
  every_run: true
  hours: 12

# Modèle de la veille. Vide : modèle actif des Réglages (celui de la voix), ou son repli
# s'il s'agit d'un modèle Claude. Fixer un autre modèle (« <fournisseur>/<modèle> ») peut
# faire recharger Ollama (latence, mémoire graphique) : à éviter sur un poste de 12 Go.
# Les modèles Claude (« claude:… ») sont refusés.
model: ""
# Longueur maximale de chaque réponse du modèle (jetons)
max_tokens: 6000
# Similarité au-delà de laquelle une idée est jugée déjà proposée (0 à 1)
idea_similarity: 0.8

# Catégories des articles (ordre = priorité de la pré-catégorie ; la dernière sert par
# défaut). Mots-clés : mot entier, casse et accents ignorés ; ils servent aussi au filtre
# des flux `filter_keywords`.
categories:
  - slug: ia
    label: IA
    keywords:
      - ia
      - ai
      - llm
      - llms
      - gpt
      - chatgpt
      - claude
      - anthropic
      - openai
      - gemini
      - gemma
      - mistral
      - llama
      - ollama
      - qwen
      - deepseek
      - rag
      - mcp
      - transformer
      - transformers
      - hugging face
      - huggingface
      - machine learning
      - deep learning
      - neural
      - chatbot
      - copilot
      - agentic
      - intelligence artificielle
      - artificial intelligence
  - slug: cloud
    label: Cloud
    keywords:
      - cloud
      - aws
      - azure
      - google cloud
      - gcp
      - kubernetes
      - k8s
      - serverless
      - lambda
      - datacenter
      - data center
      - saas
      - iaas
      - paas
      - ovhcloud
      - scaleway
  - slug: dev
    label: Dev & outils
    keywords:
      - github
      - gitlab
      - git
      - docker
      - python
      - javascript
      - typescript
      - rust
      - java
      - golang
      - api
      - sdk
      - framework
      - devops
      - open source
      - linux
      - developpeur
      - developer
      - release
      - ide
      - vscode
  - slug: securite
    label: Sécurité
    keywords:
      - securite
      - security
      - cybersecurite
      - cybersecurity
      - faille
      - vulnerabilite
      - vulnerability
      - cve
      - ransomware
      - rancongiciel
      - malware
      - phishing
      - hameconnage
      - zero-day
      - piratage
      - hack
      - breach
      - fuite
  - slug: materiel
    label: Matériel
    keywords:
      - gpu
      - cpu
      - nvidia
      - amd
      - intel
      - puce
      - chip
      - processeur
      - processor
      - smartphone
      - iphone
      - pixel
      - ram
      - ssd
      - carte graphique
      - semi-conducteurs
      - semiconductor
  - slug: informatique
    label: Monde de l'informatique

# Sélection des articles par le modèle
digest:
  # Articles gardés par passage, et au plus par source
  items_target: 30
  max_per_source: 4
  # Une seule phrase en français par article, caractères au plus
  sentence_chars: 220
  # Idées demandées au modèle, puis gardées après contrôle
  ideas_requested: 8
  ideas_kept: 6
  # Résumé écarté s'il cite un nom propre absent du titre et de l'extrait de l'article,
  # ou s'il n'en partage aucun mot (résumé inventé ou d'un autre article)
  check_summaries: true

# Apprentissage par les votes (base du routeur lue en lecture seule, cf. VOTES_DB)
learning:
  # Votes lus : les `max_votes` plus récents des `window_days` derniers jours
  window_days: 180
  max_votes: 500
  # Un vote vieux de `half_life_days` jours compte moitié moins
  half_life_days: 30
  # Lissage : un trait (source, catégorie, mot) peu voté reste proche de 0
  prior: 2
  prior_words: 3
  # Derniers titres aimés et rejetés montrés au modèle en exemple
  examples: 10
  # Part des candidats réservée aux sources de moins de `explore_min_votes` votes
  explore_ratio: 0.1
  explore_min_votes: 3
  weights:
    source: 1.0
    category: 1.0
    words: 0.8
    recency: 0.5

# Contrôle des idées
ideas:
  # Idée dont les mots figurent à cette part dans une ligne de FEATURES.md : déjà faite
  features_overlap: 0.6
  # Recouvrement des mots avec une idée « Pas intéressé » au-delà duquel elle est écartée
  rejected_overlap: 0.5
  # Idées « Intéressé » et rejetées rappelées au modèle
  liked_examples: 10
  rejected_examples: 40

# Prompt d'une idée « Intéressé » (fabriqué par le routeur, à la demande)
idea_prompt:
  # Vide : modèle du passage de l'idée, sinon modèle actif des Réglages ou son repli
  model: ""
  timeout_s: 120
  max_tokens: 1500
  # Caractères de FEATURES.md repris dans la partie « Contexte »
  features_chars: 2500
  # Taille maximale du prompt final
  max_chars: 6000
  constraints:
    - "GitFlow : branche feature/* créée depuis develop ; aucun commit direct sur develop ou main"
    - "Analyser, puis présenter un plan et attendre le Go avant de coder"
    - "Aucune dépendance nouvelle sans accord ; aucun secret dans le code"
    - "CSP de l'interface inchangée : aucune image, police ou script externe"
    - "Tests : unittest côté Python, vitest et Playwright (simulé) côté web"
    - "Documenter la fonctionnalité dans FEATURES.md (moins de 4 000 caractères)"
  project_map:
    - "deploy/s2s/router/ : routeur FastAPI (Réglages, Connexions, RAG, agents, veille)"
    - "deploy/s2s/tasks/ : service antares-tasks (veille, météo, tâches planifiées)"
    - "deploy/s2s/compose.yaml : services Docker de la pile"
    - "deploy/s2s/voices/ : catalogue des voix"
    - "web/src/ : interface Vite + React + shadcn/ui"
    - "web/tests/ : tests vitest et Playwright de l'interface"
    - "docs/ : ADR et documentation"
    - "FEATURES.md : liste des fonctionnalités"

limits:
  # Candidats envoyés au modèle (après le score des votes), au total et par source
  candidates: 90
  candidates_per_source: 8
  # Places réservées à chaque catégorie, même peu aimée : les votes classent les articles
  # à l'intérieur d'une catégorie sans pouvoir la faire disparaître
  candidates_per_category: 5
  # Places réservées à chaque source privilégiée (étoile dans l'interface)
  candidates_per_favorite: 3
  # Caractères gardés par résumé d'article
  summary_chars: 200
  # Extrait gardé pour la fiche d'un article dans l'interface
  extract_chars: 600
  # Articles non retenus enregistrés par passage (onglet « Tous les articles »)
  others_max: 600
  # Titres des dernières idées rappelés au modèle
  past_ideas: 60
  # Caractères de FEATURES.md insérés dans le prompt des idées
  features_chars: 4000
  # Âge maximal d'un article
  max_age_hours: 48
  # Délai et taille maximale de lecture d'un flux
  feed_timeout_s: 10
  feed_max_bytes: 2000000

# Report pendant un appel vocal : un tour de conversation de moins de `idle_seconds`
# signale un appel actif ; la veille attend par tranches de `wait_step_s`, au plus
# `max_wait_min` minutes, puis s'exécute quand même
call:
  idle_seconds: 120
  wait_step_s: 60
  max_wait_min: 15

